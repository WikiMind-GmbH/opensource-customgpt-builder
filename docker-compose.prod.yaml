
services:
  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile.prod
    container_name: backend
    # Pass in environment variables from the .env file (avoid baking secrets)
    env_file:
      - ./.env
    environment:
      DEBUG_MODE: false
    volumes:
      - ./backend:/app
      # - loaded_images:${LOADED_IMAGES_PATH}
    # networks:
    #   - nginx_network
    deploy:
      resources:
        limits:
          memory: 1024MB  # Limit to 512MB RAM
    healthcheck:
      test: ["CMD", "curl", "-f", "http://${APP_DOMAIN}:8000/maintenance/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
    volumes:
      - frontend_build:/app/dist

    container_name: frontend
    # networks:
    #   - nginx_network
    deploy:
      resources:
        limits:
          memory: 256M

  postgres:
    build:
      context: ./database/postgres
      dockerfile: Dockerfile.prod
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chat_context_db
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      CHAT_APP_PASSWORD: ${CHAT_APP_PASSWORD}
      CGPT_APP_PASSWORD: ${CGPT_APP_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql
    
    networks:
      - default

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d chat_context_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    build:
      context: ./nginx
      dockerfile: ./Dockerfile.prod
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - frontend_build:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt:ro          # live certs (NEW)
      - certbot_www:/var/www/certbot:ro          # ACME challenge dir (NEW)
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    # networks:
    #   - nginx_network
    deploy:
      resources:
        limits:
          memory: 128M
  
  certbot:
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt            # read/write
      - certbot_www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock # opens the docker api to the container -> kinda sketchy, but acceptable
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               docker exec nginx nginx -s reload;
               sleep 12h;
             done"

volumes:
  pgdata:
  frontend_build:
  loaded_images:
  certbot_www:
  letsencrypt:

